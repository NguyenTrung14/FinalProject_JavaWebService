spring.datasource.url=jdbc:h2:mem:badminton_booking_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
app.seed.enabled=false
app.jwt.secret=FinalProjectJavaWebServiceJwtSecretKeyMustBeAtLeastThirtyTwoBytes
app.jwt.access-token-expiration-minutes=30
app.jwt.refresh-token-expiration-days=7
